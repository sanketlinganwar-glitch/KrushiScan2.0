name: Scheduled Mandi Rates Daily Ingestion

on:
  schedule:
    # 09:30 UTC = 3:00 PM IST (after daily APMC auctions conclude across Maharashtra)
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  sync-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest & Synchronize Live Mandi Rates
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          MANDI_SYNC_SECRET: ${{ secrets.MANDI_SYNC_SECRET || 'krushiscan-mandi-sync-auth-token-2026' }}
          BACKEND_URL: 'https://krushiscan2-0-1.onrender.com'
        run: |
          if [ -z "$DATA_GOV_IN_API_KEY" ]; then
            echo "::warning::DATA_GOV_IN_API_KEY is not configured in repository secrets. Skipping live sync."
            exit 0
          fi
          python scripts/sync_mandi_rates.py --backend $BACKEND_URL
